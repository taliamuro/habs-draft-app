<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Habs Fantasy Draft</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="hero">
        <div class="wrap">

            <div>
                <div class="eyebrow">Montreal Canadiens</div>

                <h1>Habs Fantasy Draft</h1>
            </div>

            <div
                class="pill load"
                id="status"
                title="Tap to refresh"
            >
                <span class="dot"></span>
                <span id="stxt">Loading&hellip;</span>
            </div>

        </div>
    </header>

    <main>
        <div class="wrap">

            <div class="score" id="score"></div>

            <div class="rules" id="rules"></div>

            <div id="tables"></div>

            <p class="note" id="note"></p>

        </div>
    </main>
    <script src="app.js"></script>

</body>

</html>
